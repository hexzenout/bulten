<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BULTEN Kupon Defteri</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #020617;
      color: #e5e7eb;
      font-family: Arial, Helvetica, sans-serif;
    }
    body { overflow: auto; }
    .photo-shell {
      min-width: max-content;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 0;
      box-sizing: border-box;
    }
    .photo-shell img {
      display: block;
      width: auto;
      height: auto;
      max-width: none;
      max-height: none;
      background: #020617;
    }
    .empty-state {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 800;
    }
    .loading-state {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
      color: #fbbf24;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .02em;
    }
  </style>
</head>
<body>
  <main class="photo-shell" data-stage></main>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const key = params.get("key") || "";
      const fileParam = params.get("file") || "bulten-kupon-defteri.png";
      const safeFile = String(fileParam).replace(/[^a-z0-9._-]+/gi, "-").replace(/-+/g, "-").replace(/^-|-$/g, "") || "bulten-kupon-defteri.png";
      const stage = document.querySelector("[data-stage]");
      let renderedDataUrl = "";

      document.title = safeFile;

      function readPayload() {
        try { return JSON.parse(localStorage.getItem(key) || "null"); } catch { return null; }
      }

      function renderPayload() {
        const payload = readPayload();
        if (!payload) {
          if (stage) stage.innerHTML = '<div class="empty-state">Görsel bulunamadı. Kupon Defteri ekranından kamera ikonuna tekrar bas.</div>';
          return false;
        }
        if (payload.pending && !payload.dataUrl) {
          if (stage && !stage.querySelector(".loading-state")) {
            stage.innerHTML = '<div class="loading-state">Görsel hazırlanıyor...</div>';
          }
          return false;
        }
        if (!payload.dataUrl) {
          if (stage) stage.innerHTML = '<div class="empty-state">Görsel bulunamadı. Kupon Defteri ekranından kamera ikonuna tekrar bas.</div>';
          return false;
        }
        if (payload.dataUrl === renderedDataUrl && stage.querySelector("img")) return true;
        const filename = String(payload.filename || safeFile).replace(/[^a-z0-9._-]+/gi, "-").replace(/-+/g, "-").replace(/^-|-$/g, "") || safeFile;
        document.title = filename;
        renderedDataUrl = payload.dataUrl;
        const img = new Image();
        img.alt = payload.title || filename;
        img.decoding = "sync";
        img.src = payload.dataUrl;
        if (stage) {
          stage.textContent = "";
          stage.appendChild(img);
        }
        return true;
      }

      renderPayload();

      let attempts = 0;
      const timer = setInterval(() => {
        attempts += 1;
        if (renderPayload() || attempts > 80) clearInterval(timer);
      }, 250);

      window.addEventListener("message", event => {
        if (event.origin !== location.origin) return;
        if (!event.data || event.data.type !== "bulten-ledger-photo-ready") return;
        if (event.data.key && event.data.key !== key) return;
        renderPayload();
      });

      window.addEventListener("storage", event => {
        if (event.key === key) renderPayload();
      });
    })();
  </script>
</body>
</html>
