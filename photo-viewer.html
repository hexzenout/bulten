<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BULTEN Kupon Defteri</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #020617;
      color: #e5e7eb;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      overflow: auto;
    }
    .photo-shell {
      min-width: max-content;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 0;
      box-sizing: border-box;
    }
    .photo-shell img {
      display: block;
      width: auto;
      height: auto;
      max-width: none;
      max-height: none;
      background: #020617;
    }
    .photo-actions {
      position: fixed;
      right: 12px;
      top: 12px;
      z-index: 10;
      display: flex;
      gap: 8px;
      align-items: center;
      opacity: .12;
      transition: opacity .16s ease;
    }
    .photo-actions:hover,
    .photo-actions:focus-within {
      opacity: 1;
    }
    .photo-name {
      max-width: 420px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      border: 1px solid rgba(148, 163, 184, .45);
      border-radius: 999px;
      background: rgba(15, 23, 42, .84);
      color: #e5e7eb;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 12px 30px rgba(0,0,0,.3);
    }
    .photo-actions button {
      border: 1px solid rgba(245, 158, 11, .72);
      border-radius: 999px;
      background: rgba(15, 23, 42, .92);
      color: #fbbf24;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 950;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0,0,0,.3);
    }
    .photo-actions button:hover {
      background: rgba(30, 41, 59, .96);
    }
    .empty-state {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="photo-actions" aria-label="Fotoğraf işlemleri">
    <span class="photo-name" data-photo-name>BULTEN</span>
    <button type="button" data-download>PNG indir</button>
  </div>
  <main class="photo-shell" data-stage></main>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const key = params.get("key") || "";
      const fileParam = params.get("file") || "bulten-kupon-defteri.png";
      const safeFile = String(fileParam).replace(/[^a-z0-9._-]+/gi, "-").replace(/-+/g, "-").replace(/^-|-$/g, "") || "bulten-kupon-defteri.png";
      const stage = document.querySelector("[data-stage]");
      const nameEl = document.querySelector("[data-photo-name]");
      const button = document.querySelector("[data-download]");
      let payload = null;
      try { payload = JSON.parse(localStorage.getItem(key) || "null"); } catch {}
      if (!payload || !payload.dataUrl) {
        document.title = safeFile;
        if (nameEl) nameEl.textContent = safeFile;
        if (stage) stage.innerHTML = '<div class="empty-state">Görsel bulunamadı. Kupon Defteri ekranından kamera ikonuna tekrar bas.</div>';
        return;
      }
      const filename = String(payload.filename || safeFile).replace(/[^a-z0-9._-]+/gi, "-").replace(/-+/g, "-").replace(/^-|-$/g, "") || safeFile;
      const title = payload.title || filename;
      document.title = filename;
      if (nameEl) nameEl.textContent = filename;
      const img = new Image();
      img.alt = title;
      img.decoding = "sync";
      img.src = payload.dataUrl;
      if (stage) {
        stage.textContent = "";
        stage.appendChild(img);
      }
      const svgToPng = function (dataUrl) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => {
            try {
              const canvas = document.createElement("canvas");
              canvas.width = Math.max(1, image.naturalWidth || image.width || 1);
              canvas.height = Math.max(1, image.naturalHeight || image.height || 1);
              const ctx = canvas.getContext("2d");
              ctx.fillStyle = "#020617";
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.drawImage(image, 0, 0);
              canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("PNG üretilemedi")), "image/png");
            } catch (error) { reject(error); }
          };
          image.onerror = () => reject(new Error("Görsel okunamadı"));
          image.src = dataUrl;
        });
      };
      const downloadBlob = function (blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename.toLowerCase().endsWith(".png") ? filename : filename + ".png";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1200);
      };
      if (button) {
        button.addEventListener("click", () => {
          svgToPng(payload.dataUrl).then(downloadBlob).catch(() => {
            const a = document.createElement("a");
            a.href = payload.dataUrl;
            a.download = filename.toLowerCase().endsWith(".png") ? filename : filename + ".png";
            document.body.appendChild(a);
            a.click();
            a.remove();
          });
        });
      }
    })();
  </script>
</body>
</html>
