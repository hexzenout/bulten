name: Update Radar Data

on:
  schedule:
    - cron: "0 0,7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri kur
        run: pip install -r requirements.txt

      - name: Radar motorunu çalıştır
        env:
          ODDS_KEYS: ${{ secrets.ODDS_KEYS }}
        run: python v19_motor.py

      - name: Güncel veriyi commit et
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add v19_rapor.json
          git commit -m "Auto radar update" || echo "No changes"
          git push
